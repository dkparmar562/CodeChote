# Builds the app and runs every test on each push and pull request:
# unit tests, integration tests over SSH against the local test host, and the end-to-end UI tests.
name: CI

on:
  push:
    branches: [main, develop, app-first]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen go-task
          # SwiftTerm needs the Metal toolchain.
          xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Placeholder workbench bundle
        # The VS Code bundle isn't in git (task workbench:build makes it); the app builds and runs without it.
        run: mkdir -p ios/Resources/vscode-web

      - name: Build
        run: task build

      - name: Unit and integration tests
        run: task test:integration

      - name: UI tests
        run: task test:ui

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .build/test/test.log
            .build/test/dd/Logs/Test/*.xcresult
            .build/testhost/sshd.log
          if-no-files-found: ignore
